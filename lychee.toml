# lychee link checker config — auto-loaded as `lychee.toml` (lychee's default name).
# Read by `make check_links` and by the estate CI workflow (qte77/.github lint-md-links),
# which calls lychee without --config — so this exact filename is what CI uses.
# https://lychee.cli.rs/usage/config/

accept = [200, 201, 204, 429]
timeout = 30
max_retries = 2

exclude_path = [
    ".venv", ".claude", "node_modules", ".pytest_cache", ".complexipy_cache",
    # A dated record of ~180 company homepages, each confirmed on 2026-11-12 with polyfetch
    # (bulk + browser tier). About 20 corporate sites 403 or reset lychee's client, so checking
    # this file in CI would fail on bot filtering, not dead links. Re-validate with polyfetch.
    "docs/reference/engineering-ai-map.md",
]

# Exclusions are evidence-based, not pre-emptive: each host below returned 403 to lychee
# but the cited page was confirmed live on 2026-10-09. An exclusion also hides a real dead
# link, so add one only after the same check — never a blanket "known bot-blocking" list.
exclude = [
    # 403 to lychee; 200 via a browser TLS fingerprint (polyfetch curl_cffi tier) → TLS filtering
    "^https://inis\\.iaea\\.org",
    "^https://openai\\.com",
    # 403 to lychee (bot challenge); DOI 10.1145/3772363.3798904 confirmed registered via the
    # doi.org handle API, resolving to the exact cited URL
    "^https://dl\\.acm\\.org",
    # 503 to lychee on two consecutive CI runs (2026-10-10); the file is confirmed present on
    # `devel` via the GitHub contents API. One URL, not the host
    "^https://github\\.com/ElmerCSC/elmerfem/blob/devel/license_texts/ElmerLicensePolicy\\.md$",
    # 403 (Akamai) to lychee and to headless browsers; pages confirmed live 2026-10-23 via
    # polyfetch --tier patchright --headed under xvfb-run (fusion-compute-mcp,
    # autodesk-assistant-script-execute-update). The Fusion blog path only, not the host
    "^https://www\\.autodesk\\.com/products/fusion-360/blog/",
    # Same Akamai 403; both pages confirmed live 2026-11-11 with polyfetch --tier patchright
    # --headed under xvfb-run (Fusion personal-use compare table, Fusion system requirements).
    # Exact URLs only
    "^https://www\\.autodesk\\.com/products/fusion-360/personal/compare$",
    "^https://www\\.autodesk\\.com/support/technical/article/caas/sfdcarticles/sfdcarticles/System-requirements-for-Autodesk-Fusion-360\\.html$",
    # SEC EDGAR 403s clients without a declared User-Agent; Cadence's Q3 2026 10-Q confirmed
    # live 2026-11-12 with polyfetch --tier curl_cffi. Exact URL only
    "^https://www\\.sec\\.gov/Archives/edgar/data/0000813672/000081367226000121/cdns-20260930\\.htm$",
    # 403 to the CI runner's lychee (passed locally the same day); confirmed live 2026-11-12
    # with polyfetch --tier patchright --headed under xvfb-run. Exact URL only
    "^https://www\\.cadence\\.com/en_US/home/company/newsroom/press-releases/pr/2026/cadence-completes-acquisition-of-hexagons-design-and-engineering\\.html$",
]

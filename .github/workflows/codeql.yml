name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # CodeQL hard-fails with "no source code seen" when there are no .py files.
      # Skip until M1 lands Python, and say so — a silent skip would read as "scanned clean".
      - name: Report skipped analysis (no Python files yet)
        if: hashFiles('**/*.py') == ''
        run: echo "::notice title=CodeQL skipped::No Python files in the repo yet — analysis activates once M1 adds src/."
      - name: Initialize CodeQL
        if: hashFiles('**/*.py') != ''
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        if: hashFiles('**/*.py') != ''
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:python"
          output: sarif-results
      - name: Dismiss suppressed alerts
        if: hashFiles('**/*.py') != ''
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8  # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
